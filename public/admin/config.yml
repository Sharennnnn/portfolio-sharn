backend:
  name: github
  repo: Sharennnnn/portfolio-sharn
  base_url: https://sveltia-cms-auth.rennesoncharlie.workers.dev
  # Dépôt public : le jeton n'a pas besoin d'accéder aux dépôts privés.
  auth_scope: public_repo
  

# Noms de fichiers sans accents ni caractères spéciaux (projets et images).
slug:
  encoding: ascii
  clean_accents: true

# Habillage de l'admin
app_title: Shar'N — Admin
logo:
  src: /favicon.svg

# Pas de modèle d'aperçu : le panneau montrerait un rendu brut. Le bouton « Voir sur le site » le remplace.
editor:
  preview: false

media_folder: public/images/projets
public_folder: /images/projets

# Images envoyées depuis l'admin : nom nettoyé, conversion WebP, 1600 px de large max.
# Le poids max (2 Mo) s'applique après conversion (vérifié dans le code de Sveltia 0.246).
media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 2097152
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1600
          height: 2400

collections:
  - name: projets
    label: Projets
    label_singular: Projet
    icon: grid_view
    description: 'Tes 25 projets. « Réorganiser » pour changer l''ordre de la grille par glisser-déposer.'
    folder: src/content/projets
    # Sans ce réglage, Sveltia nomme les nouveaux projets avec un identifiant aléatoire.
    identifier_field: titre
    create: true
    slug: '{{slug}}'
    summary: '{{annee}} — {{titre}}'
    thumbnail: couverture
    preview_path: 'projets/{{slug}}/'
    # Glisser-déposer : Sveltia renumérote « ordre » de 1 à N.
    reorder: { key: ordre }
    sortable_fields:
      fields: [ordre, annee, titre]
      default: { field: ordre }
    view_filters:
      - { label: 'Commandes client', field: origine, pattern: client }
      - { label: 'Fan art', field: origine, pattern: fanart }
      - { label: 'Exercices académiques', field: origine, pattern: exercice }
      - { label: 'Projets personnels', field: origine, pattern: perso }
      - { label: 'Mis en avant sur l''accueil', field: phare, pattern: true }
    fields:
      - { name: titre, label: 'Titre (FR)', widget: string }
      - { name: titre_en, label: 'Titre (EN)', widget: string }
      - { name: annee, label: Année, widget: number, value_type: int, min: 2020, max: 2035 }

      - name: origine
        label: Provenance
        widget: select
        options:
          - { label: 'Commande client', value: client }
          - { label: 'Fan art', value: fanart }
          - { label: 'Exercice académique', value: exercice }
          - { label: 'Projet personnel', value: perso }

      - name: disciplines
        label: Disciplines
        widget: select
        multiple: true
        options:
          - { label: Print, value: print }
          - { label: Identité, value: identite }
          - { label: Animation, value: animation }

      - { name: client, label: 'Client (facultatif)', widget: string, required: false, hint: 'Laisse vide pour un fan art ou un exercice.' }
      - { name: couverture, label: 'Image de couverture', hint: 'Image portrait : la grille l''affiche au format 3:4. Convertie en WebP à l''envoi.', widget: image, accept: 'image/webp,image/jpeg,image/png,image/avif' }
      - { name: survol, label: 'Image au survol (facultatif)', hint: 'Remplace la couverture quand on passe la souris dessus.', widget: image, required: false, accept: 'image/webp,image/jpeg,image/png,image/avif' }
      - name: galerie
        label: 'Galerie (facultatif)'
        hint: 'Images affichées sous les textes, dans cet ordre.'
        widget: list
        required: false
        field: { name: image, label: Image, widget: image, accept: 'image/webp,image/jpeg,image/png,image/avif' }
      - name: video
        label: 'Vidéo YouTube (facultatif)'
        hint: 'Lien complet, ex. https://youtu.be/XXXXXXXXXXX'
        widget: string
        required: false

      - { name: contrainte, label: 'Le brief (FR)', widget: text, hint: 'Le problème posé et la contrainte de départ : consigne, client, format, délai. Mets « - » pour masquer la rubrique.' }
      - { name: contrainte_en, label: 'The brief (EN)', widget: text }
      - { name: resolution, label: 'Mes choix (FR)', widget: text, hint: 'Ta décision de conception et pourquoi. Mets « - » pour masquer la rubrique.' }
      - { name: resolution_en, label: 'My approach (EN)', widget: text }
      - { name: resultat, label: 'Résultat (FR, facultatif)', widget: text, required: false, hint: 'Ce qui a été livré ou utilisé, la note, le retour du client ou du jury.' }
      - { name: resultat_en, label: 'Outcome (EN, optional)', widget: text, required: false }

      - { name: livrables, label: 'Livrables (FR)', widget: string, required: false }
      - { name: livrables_en, label: 'Deliverables (EN)', widget: string, required: false }
      - { name: outils, label: Outils, widget: list, required: false, hint: 'Un logiciel par élément (Photoshop, Illustrator…).' }

      - { name: phare, label: 'Mis en avant sur l''accueil', hint: 'Les 4 premiers projets cochés (selon l''ordre) apparaissent dans la sélection de l''accueil', widget: boolean, default: false }
      # Géré par « Réorganiser » dans la liste des projets ; un nouveau projet arrive en fin de grille.
      - { name: ordre, widget: hidden, default: 50 }
      - { name: body, label: 'Texte long (facultatif)', widget: markdown, required: false }
singletons:
  - name: reglages
    label: Réglages du site
    icon: tune
    file: src/content/reglages/site.yaml
    preview_path: '/'
    fields:
      - name: hero
        collapsed: true
        label: Accueil — En-tête et appel à contact
        widget: object
        fields:
          - { name: eyebrow, label: 'Sur-titre (FR)', widget: string }
          - { name: eyebrow_en, label: 'Sur-titre (EN)', widget: string }
          - { name: titre1, label: 'Titre — ligne 1 (FR)', widget: string }
          - { name: titre1_en, label: 'Titre — ligne 1 (EN)', widget: string }
          - { name: titre2, label: 'Titre — ligne 2, début (FR)', widget: string }
          - { name: titre2_en, label: 'Titre — ligne 2, début (EN)', widget: string }
          - { name: titre3, label: 'Titre — ligne 2, fin en italique (FR)', widget: string }
          - { name: titre3_en, label: 'Titre — ligne 2, fin en italique (EN)', widget: string }
          - { name: chapeau, label: 'Accroche (FR)', widget: text }
          - { name: chapeau_en, label: 'Accroche (EN)', widget: text }
          - { name: cta_titre, label: 'CTA — titre (FR)', widget: string }
          - { name: cta_titre_en, label: 'CTA — titre (EN)', widget: string }
          - { name: cta_texte, label: 'CTA — texte (FR)', widget: string }
          - { name: cta_texte_en, label: 'CTA — texte (EN)', widget: string }
          - { name: cta_bouton, label: 'CTA — bouton (FR)', widget: string }
          - { name: cta_bouton_en, label: 'CTA — bouton (EN)', widget: string }

      - name: banniere
        collapsed: true
        label: Bannière (accueil, sous le menu)
        widget: object
        fields:
          - { name: visible, label: Afficher la bannière, widget: boolean, default: false }
          - { name: image, label: Image, widget: image, required: false, accept: 'image/webp,image/jpeg,image/png,image/avif' }
          - { name: lien, label: 'Lien au clic (optionnel)', widget: string, required: false }

      - name: sections
        label: Sections de l'accueil — ordre et visibilité
        widget: list
        hint: 'Fais glisser pour réordonner. Décoche pour masquer sans supprimer.'
        fields:
          - name: cle
            label: Section
            widget: select
            options:
              - { label: 'Sélection de projets', value: selection }
              - { label: 'Deux façons de travailler', value: duo }
              - { label: 'Appel à contact (CTA)', value: cta }
          - { name: visible, label: Visible, widget: boolean, default: true }

      - name: apropos
        collapsed: true
        label: À propos
        widget: object
        thumbnail: photo
        fields:
          - { name: photo, label: 'Photo de profil (facultatif)', widget: image, required: false, hint: 'Portrait, affiché au format 3:4 en haut de la colonne de droite. Laisse vide pour ne pas afficher de photo.', accept: 'image/webp,image/jpeg,image/png,image/avif' }
          - { name: bio, label: 'Paragraphes de bio (FR)', widget: list, field: { name: paragraphe, widget: text } }
          - { name: bio_en, label: 'Paragraphes de bio (EN)', widget: list, field: { name: paragraphe, widget: text } }
          - name: parcours
            label: Parcours
            widget: list
            collapsed: true
            summary: '{{periode}} · {{titre}}'
            fields:
              - { name: periode, label: Période, widget: string }
              - { name: titre, label: 'Intitulé (FR)', widget: string }
              - { name: titre_en, label: 'Intitulé (EN)', widget: string, required: false }
              - { name: lieu, label: 'Lieu / détail (FR)', widget: string }
              - { name: lieu_en, label: 'Lieu / détail (EN)', widget: string, required: false }
          - name: competences
            label: Compétences
            widget: list
            collapsed: true
            summary: '{{groupe}} : {{outils}}'
            fields:
              - { name: groupe, label: 'Catégorie (FR)', widget: string }
              - { name: groupe_en, label: 'Catégorie (EN)', widget: string, required: false }
              - { name: outils, label: Outils, widget: string }

      - name: contact
        collapsed: true
        label: Contact
        widget: object
        fields:
          - { name: email, label: Email, widget: string }
          - { name: instagram, label: 'Lien Instagram', widget: string, required: false }
          - { name: linkedin, label: 'Lien LinkedIn', widget: string, required: false }

      - name: theme
        collapsed: true
        label: Apparence
        widget: object
        fields:
          - { name: accent, label: 'Couleur d''accent', widget: color }